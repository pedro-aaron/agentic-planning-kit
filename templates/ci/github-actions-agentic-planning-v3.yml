# Copy into a consumer repository as .github/workflows/agentic-planning-v3.yml.
# Adjust KIT_PATH if the kit folder has another name.
name: Agentic planning v3

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: agentic-planning-v3-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate-planning-control:
    runs-on: ubuntu-latest
    env:
      KIT_PATH: agentic-planning-kit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate v3 artifacts
        run: python "$KIT_PATH/tools/agentic_planning_v3.py" validate --root .

      - name: Validate active claims
        run: python "$KIT_PATH/tools/agentic_planning_v3.py" claims --root .

      - name: Check deterministic projections
        if: github.event_name == 'merge_group'
        run: python "$KIT_PATH/tools/agentic_planning_v3.py" render --root . --check

      - name: Reject contributor edits to protected projections
        if: github.event_name == 'pull_request'
        run: python "$KIT_PATH/tools/agentic_planning_v3.py" protected --root . --base "origin/${{ github.base_ref }}"

      - name: Verify protected integration outputs
        if: github.event_name == 'merge_group'
        run: python "$KIT_PATH/tools/agentic_planning_v3.py" protected --root . --base origin/main --integration

# Pull requests validate immutable sources and forbid protected-output edits; they
# intentionally do not require projections to include unmerged sources. This
# workflow validates but does not advance main or commit generated views.
# Configure a protected, serialized integration runner to execute
# PROMPT_RECONCILE_MAIN / `render --write`, rerun these checks and advance main
# only when its expected old SHA still matches.
